# Se suma al compose base (requiere el servicio mosquitto).
services:
  acq-pir:
    build: ./acq-pir
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      SIMULATE: ${SIMULATE:-true}
      PIR_GPIO: ${PIR_GPIO:-17}
    devices:
      - /dev/gpiomem:/dev/gpiomem
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthy) )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
