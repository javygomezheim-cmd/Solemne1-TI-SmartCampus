# Se suma al compose base (requiere el servicio mosquitto).
services:
  acq-dht:
    build: ./acq-dht
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      SIMULATE: ${SIMULATE:-true}
      DHT_GPIO: ${DHT_GPIO:-4}
    # GPIO sin modo privilegiado. Si pruebas fuera de la Pi, comenta estas líneas.
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthy) )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
